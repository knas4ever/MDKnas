name: Release (Linux AppImage + deb, Windows exe + MSIX)

on:
  push:
    branches: [master]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev xdg-utils
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v6
        with:
          name: MDKnas-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
      - name: Publish release for package.json version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists, skipping"
          else
            gh release create "v$VERSION" \
              src-tauri/target/release/bundle/appimage/*.AppImage \
              src-tauri/target/release/bundle/deb/*.deb \
              --title "MDKnas $VERSION" --notes-file CHANGELOG.md --target "$GITHUB_SHA"
          fi

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run dist:win
      - name: Build MSIX (unsigned, for Microsoft Store upload)
        shell: pwsh
        run: ./msix/pack.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: MDKnas-msix
          path: msix-out/*.msix
      - name: Attach Windows files to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIP="MDKnas-$VERSION-win-x64.zip"
          powershell -Command "Compress-Archive -Path src-tauri/target/release/mdknas.exe -DestinationPath $ZIP"
          gh release upload "v$VERSION" "$ZIP" msix-out/*.msix --clobber
          cp src-tauri/target/release/mdknas.exe MDKnas-win-x64.exe
          gh release upload "v$VERSION" MDKnas-win-x64.exe --clobber
