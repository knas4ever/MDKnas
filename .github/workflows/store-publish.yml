name: Publish to Microsoft Store

# Manual trigger or a version tag. Needs the repository secrets listed in STORE.md.
on:
  workflow_dispatch:
  push:
    tags: ['store-v*']

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx tauri build --no-bundle
      - name: Build MSIX
        shell: pwsh
        run: ./msix/pack.ps1
      - uses: microsoft/microsoft-store-apppublisher@v1.4
      - name: Configure Store credentials
        shell: pwsh
        run: >
          msstore reconfigure
          --tenantId ${{ secrets.STORE_TENANT_ID }}
          --sellerId ${{ secrets.STORE_SELLER_ID }}
          --clientId ${{ secrets.STORE_CLIENT_ID }}
          --clientSecret ${{ secrets.STORE_CLIENT_SECRET }}
      - name: Submit package
        shell: pwsh
        run: msstore publish msix-out\pkg -id ${{ secrets.STORE_PRODUCT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: mdknas-msix-released
          path: msix-out/*.msix
